name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Rovo.slnx
      - name: Build WPF application and tests
        run: dotnet build Rovo.slnx -c Release --no-restore
      - name: Test (real Robocopy integration runs on Windows)
        run: dotnet test Rovo.Tests/Rovo.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: WPF startup and idle-close smoke check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./Rovo/bin/Release/net10.0-windows/Rovo.exe -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            do {
              $app.Refresh()
              if ($app.HasExited) { throw "Rovo exited before showing its window (exit $($app.ExitCode))." }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) { break }
              Start-Sleep -Milliseconds 200
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($app.MainWindowHandle -eq [IntPtr]::Zero -or $app.MainWindowTitle -ne 'Rovo') {
              throw 'Rovo did not create its main window.'
            }
            if (-not $app.Responding) { throw 'The Rovo window is not responding.' }
            if (-not $app.CloseMainWindow()) { throw 'Could not request a normal window close.' }
            if (-not $app.WaitForExit(10000)) { throw 'Rovo did not close within 10 seconds.' }
            if ($app.ExitCode -ne 0) { throw "Rovo exited with code $($app.ExitCode)." }
            Write-Output 'Rovo created a responsive main window and closed normally.'
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            $app.Dispose()
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
